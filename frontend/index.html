<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Batch Financial Data Processing Service" />
    <title>BFDP · Batch Financial Processor</title>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#f87171;background:#18181b;min-height:100vh;"><h2 style="font-size:18px;margin-bottom:12px;color:#ef4444;">Application Initialization Error</h2><pre style="background:#27272a;padding:16px;border-radius:6px;overflow:auto;font-family:monospace;font-size:12px;color:#fecaca;">' + (event.error ? (event.error.stack || event.error.message) : event.message) + '</pre><p style="margin-top:16px;color:#a1a1aa;font-size:14px;">Please open the browser Developer Tools (F12) for more details.</p></div>';
        }
      });
    </script>
  </head>
  <body class="h-full bg-canvas text-zinc-100 antialiased">
    <noscript>
      <div style="padding:24px;color:#fff;background:#18181b;min-height:100vh;font-family:sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript to view this application.</p>
      </div>
    </noscript>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
