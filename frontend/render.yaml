# -----------------------------------------------------------------------------
# Render Blueprint (Infrastructure as Code) - Frontend Static Site
# 100% Free deployment for Batch Financial Data Processor (BFDP) Frontend SPA
# https://render.com/docs/blueprint-spec
# -----------------------------------------------------------------------------
version: "1"

services:
  - type: web
    name: bfdp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set in Render UI: your backend URL (e.g. https://bfdp-api.onrender.com)

